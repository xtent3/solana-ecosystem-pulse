name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['output/premium_dashboard.html', 'output/snapshot.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp output/premium_dashboard.html _site/index.html
          cp output/snapshot.json _site/
          echo "<!-- Solana Ecosystem Pulse — auto-deployed -->" >> _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
