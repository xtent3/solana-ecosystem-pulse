name: Update Solana Ecosystem Pulse

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate
        run: python -m unittest discover -s tests -v
      - name: Generate reports
        run: python -m solpulse --output output --timeout 45
      - name: Commit changed artifacts
        run: |
          if git diff --quiet -- output; then
            echo "No report changes"
            exit 0
          fi
          git config user.name "solpulse-bot"
          git config user.email "solpulse-bot@users.noreply.github.com"
          git add output/dashboard.html output/report.md output/snapshot.json
          git commit -m "chore: refresh Solana ecosystem pulse"
          git push
